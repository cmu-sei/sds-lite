name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      version:
        description: Base version without a prerelease suffix, such as 1.2.0
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$SELECTED_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate the requested release
        env:
          BASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION="$(node scripts/resolve-release-version.mjs)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "branch=release/v$VERSION" >> "$GITHUB_ENV"
          echo "Preparing $RELEASE_CHANNEL release v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure only one release is in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create release --color 5319e7 --description "Release preparation" --force
          OPEN_BRANCH="$(gh pr list --state open --label release --json headRefName --jq '.[0].headRefName // ""')"
          if [[ -n "$OPEN_BRANCH" && "$OPEN_BRANCH" != "$branch" ]]; then
            echo "::error::Release pull request $OPEN_BRANCH is already open"
            exit 1
          fi

      - name: Prepare and test the release
        run: |
          git switch -C "$branch"
          npm run release:prepare -- --version "$VERSION" --yes

      - name: Commit and push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "::error::Release preparation did not produce any changes"
            exit 1
          fi
          git commit -m "release: prepare v$VERSION"
          git push --force-with-lease --set-upstream origin "$branch"

      - name: Create or locate the draft GitHub release
        id: draft-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_DATA="$(gh release view "$TAG" --json isDraft,url 2>/dev/null || true)"
          if [[ -n "$RELEASE_DATA" ]]; then
            if [[ "$(node -e 'console.log(JSON.parse(process.argv[1]).isDraft)' "$RELEASE_DATA")" != true ]]; then
              echo "::error::$TAG is already published"
              exit 1
            fi
            RELEASE_URL="$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$RELEASE_DATA")"
          else
            OPTIONS=(--draft --generate-notes --target "${{ github.event.repository.default_branch }}" --title "SDS Lite $TAG")
            if [[ "$VERSION" == *-beta.* ]]; then
              OPTIONS+=(--prerelease)
            fi
            RELEASE_URL="$(gh release create "$TAG" "${OPTIONS[@]}")"
          fi
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Create or update the release pull request
        id: pull-request
        env:
          DRAFT_RELEASE_URL: ${{ steps.draft-release.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$RUNNER_TEMP/release-pr.md"
          cat > "$BODY" <<EOF
          ## Release v$VERSION

          This pull request was generated by the Prepare Release workflow. Merging it starts protected publication.

          ## Automated validation

          - Package version, generated distribution, tests, and package limits were validated by the workflow.
          - CI is dispatched explicitly for this generated branch.
          - Review and edit the [draft GitHub release]($DRAFT_RELEASE_URL).

          ## Required manual release checks

          Record browser, operating system, assistive technology, versions, tester, date, and outcome below before checking each item.

          - [ ] Keyboard testing completed. <!-- release-check:keyboard -->
          - [ ] Testing at 200% zoom completed. <!-- release-check:zoom-200 -->
          - [ ] Testing at 400% zoom completed. <!-- release-check:zoom-400 -->
          - [ ] Reduced-motion testing completed. <!-- release-check:reduced-motion -->
          - [ ] Forced-colors testing completed where supported. <!-- release-check:forced-colors -->
          - [ ] Screen-reader/browser testing recorded for each supported desktop platform. <!-- release-check:screen-readers -->
          - [ ] Current Chrome, Edge, Firefox, and Safari smoke tests completed. <!-- release-check:browser-smoke-tests -->
          - [ ] Generated release notes and migration guidance reviewed. <!-- release-check:release-notes -->

          ## Manual test evidence

          <!-- release-evidence:replace -->
          Replace this marker with the manual test results.
          EOF

          PR_URL="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
          if [[ -n "$PR_URL" ]]; then
            gh pr edit "$PR_URL" --title "Release v$VERSION" --add-label release
          else
            PR_URL="$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Release v$VERSION" --body-file "$BODY" --label release)"
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "### Release pull request" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch CI for the generated branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "$branch"