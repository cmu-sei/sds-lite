name: Prepare Release
run-name: Prepare ${{ inputs.channel }} release from ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: stable publishes to latest; beta publishes the next beta
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
      version:
        description: Base SemVer only, such as 1.2.0 (no v or -beta.N)
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$SELECTED_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate the requested release
        env:
          BASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION="$(node scripts/resolve-release-version.mjs)"
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "branch=release/v$VERSION"
          } >> "$GITHUB_ENV"
          echo "Preparing $RELEASE_CHANNEL release v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure only one release is in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create release --color 5319e7 --description "Release preparation" --force
          OPEN_BRANCH="$(gh pr list --state open --label release --json headRefName --jq '.[0].headRefName // ""')"
          if [[ -n "$OPEN_BRANCH" && "$OPEN_BRANCH" != "$branch" ]]; then
            echo "::error::Release pull request $OPEN_BRANCH is already open"
            exit 1
          fi

      - name: Prepare and validate the release
        run: |
          git switch -C "$branch"
          npm run release:prepare -- --version "$VERSION" --yes

      - name: Commit and push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "::error::Release preparation did not produce any changes"
            exit 1
          fi
          git commit -m "release: prepare v$VERSION"
          git push --force-with-lease --set-upstream origin "$branch"

      - name: Create or locate the draft GitHub release
        id: draft-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_DATA="$(gh release view "$TAG" --json isDraft,url 2>/dev/null || true)"
          if [[ -n "$RELEASE_DATA" ]]; then
            if [[ "$(node -e 'console.log(JSON.parse(process.argv[1]).isDraft)' "$RELEASE_DATA")" != true ]]; then
              echo "::error::$TAG is already published"
              exit 1
            fi
            RELEASE_URL="$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$RELEASE_DATA")"
          else
            OPTIONS=(--draft --generate-notes --target "${{ github.event.repository.default_branch }}" --title "SDS Lite $TAG")
            if [[ "$VERSION" == *-beta.* ]]; then
              OPTIONS+=(--prerelease)
            fi
            RELEASE_URL="$(gh release create "$TAG" "${OPTIONS[@]}")"
          fi
          RAW_NOTES="$RUNNER_TEMP/release-notes-raw.md"
          FORMATTED_NOTES="$RUNNER_TEMP/release-notes-formatted.md"
          gh release view "$TAG" --json body --jq .body > "$RAW_NOTES"
          VERSION="$VERSION" node scripts/format-release-notes.mjs < "$RAW_NOTES" > "$FORMATTED_NOTES"
          if ! cmp --silent "$RAW_NOTES" "$FORMATTED_NOTES"; then
            gh release edit "$TAG" --notes-file "$FORMATTED_NOTES"
          fi
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Create or update the release pull request
        id: pull-request
        env:
          DRAFT_RELEASE_URL: ${{ steps.draft-release.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$RUNNER_TEMP/release-pr.md"
          cat > "$BODY" <<EOF
          ## Release v$VERSION

          This pull request was generated by the Prepare Release workflow. Merging it starts protected publication.

          ## Finish this release

          1. Wait for **Build and test** to pass and review the generated file changes.
          2. Open the [draft GitHub release]($DRAFT_RELEASE_URL) and follow its editor guide. If the generated notes are already clear and accurate, no edits are needed.
          3. Obtain approval and merge normally. Merging confirms that the generated changes and draft release were reviewed.
          4. Approve the protected deployment when **Finalize Release** pauses.

          ## Automated validation

          - Package version, generated distribution, non-browser tests, and package limits were validated by the preparation workflow.
          - The generated pull request runs the required full browser CI matrix. Refreshing an existing release explicitly reruns it.
          - The draft release is published only after this pull request is approved and merged.
          EOF

          PR_URL="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
          if [[ -n "$PR_URL" ]]; then
            gh pr edit "$PR_URL" --title "Release v$VERSION" --add-label release
            REFRESHED=true
          else
            PR_URL="$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Release v$VERSION" --body-file "$BODY" --label release)"
            REFRESHED=false
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "refreshed=$REFRESHED" >> "$GITHUB_OUTPUT"
          echo "### Release pull request" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Rerun CI for a refreshed release
        if: steps.pull-request.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "$branch"
