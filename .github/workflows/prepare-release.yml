name: Release - Create Release PR
run-name: Create ${{ inputs.channel }} release PR from ${{ inputs.version }}

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      version:
        default: ''
        type: string
      fix_pr:
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      channel:
        description: stable = main to latest; beta = next beta; hotfix = fix latest only
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - hotfix
      version:
        description: Stable/beta only - base version such as 1.2.0. Leave blank for hotfix.
        required: false
        type: string
      fix_pr:
        description: Hotfix only - paste the merged fix pull request link or number
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  packages: read
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Build release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$SELECTED_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@cmu-sei'

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Validate the requested release
        if: inputs.channel != 'hotfix'
        env:
          BASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          VERSION="$(node scripts/resolve-release-version.mjs)"
          {
            echo "VERSION=$VERSION"
            echo "TAG=v$VERSION"
            echo "branch=release/v$VERSION"
            echo "RELEASE_BASE=${{ github.event.repository.default_branch }}"
          } >> "$GITHUB_ENV"
          echo "Preparing $RELEASE_CHANNEL release v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare latest-only hotfix source
        if: inputs.channel == 'hotfix'
        env:
          BASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOTFIX_PR: ${{ inputs.fix_pr }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ -n "$BASE_VERSION" ]]; then
            echo "::error::Leave version blank for hotfix; the next patch is selected automatically"
            exit 1
          fi
          node scripts/prepare-hotfix.mjs

      - name: Ensure only one release is in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CANCELLED_PR="$(gh pr list --state merged --head "$branch" --label release-cancelled --json number --jq '.[0].number // ""')"
          if [[ -n "$CANCELLED_PR" ]]; then
            echo "::error::$TAG was cancelled after merge. Choose a newer base version"
            exit 1
          fi
          gh label create release --color 5319e7 --description "Release preparation" --force
          RELEASE_BRANCH="$branch" node scripts/validate-release-pr.mjs prepare

      - name: Install release source dependencies
        run: npm ci --ignore-scripts

      - name: Prepare and validate the release
        run: |
          git switch -C "$branch"
          npm run release:prepare -- --version "$VERSION" --yes

      - name: Commit and push the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "::error::Release preparation did not produce any changes"
            exit 1
          fi
          if [[ "${{ inputs.channel }}" == hotfix ]]; then
            git commit --amend --reset-author -m "release: prepare hotfix v$VERSION (fix #$HOTFIX_NUMBER)"
          else
            git commit -m "release: prepare v$VERSION"
          fi
          git push --force-with-lease --set-upstream origin "$branch"

      - name: Create or locate the draft GitHub release
        id: draft-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ERROR="$RUNNER_TEMP/draft-release-error"
          if RELEASE_DATA="$(gh release view "$TAG" --json isDraft 2>"$RELEASE_ERROR")"; then
            :
          elif grep -qi 'release not found' "$RELEASE_ERROR"; then
            RELEASE_DATA=""
          else
            cat "$RELEASE_ERROR"
            exit 1
          fi
          if [[ -n "$RELEASE_DATA" ]]; then
            if [[ "$(node -e 'console.log(JSON.parse(process.argv[1]).isDraft)' "$RELEASE_DATA")" != true ]]; then
              echo "::error::$TAG is already published"
              exit 1
            fi
          else
            OPTIONS=(--draft --generate-notes --target "$branch" --title "SDS Lite $TAG")
            if [[ -n "${NOTES_START_TAG:-}" ]]; then
              HOTFIX_NOTES="$RUNNER_TEMP/hotfix-notes.md"
              gh api "repos/$GITHUB_REPOSITORY/pulls/$HOTFIX_NUMBER" | node scripts/format-release-notes.mjs --hotfix > "$HOTFIX_NOTES"
              OPTIONS=(--draft --target "$branch" --title "SDS Lite $TAG" --notes-file "$HOTFIX_NOTES")
            fi
            if [[ "$VERSION" == *-beta.* ]]; then
              OPTIONS+=(--prerelease)
            fi
            gh release create "$TAG" "${OPTIONS[@]}"
          fi
          RAW_NOTES="$RUNNER_TEMP/release-notes-raw.md"
          FORMATTED_NOTES="$RUNNER_TEMP/release-notes-formatted.md"
          gh release view "$TAG" --json body --jq .body > "$RAW_NOTES"
          VERSION="$VERSION" node scripts/format-release-notes.mjs < "$RAW_NOTES" > "$FORMATTED_NOTES"
          if ! cmp --silent "$RAW_NOTES" "$FORMATTED_NOTES"; then
            gh release edit "$TAG" --notes-file "$FORMATTED_NOTES"
          fi
          RELEASES_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          RELEASE_URL="$(gh release view "$TAG" --json url --jq .url 2>/dev/null || true)"
          if [[ "$RELEASE_URL" != "$RELEASES_URL/tag/untagged-"* ]]; then
            echo "::warning::GitHub did not return a usable draft release URL; linking to $RELEASES_URL"
            RELEASE_URL="$RELEASES_URL"
          fi
          echo "url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

      - name: Create or update the release pull request
        id: pull-request
        env:
          DRAFT_RELEASE_URL: ${{ steps.draft-release.outputs.url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$RUNNER_TEMP/release-pr.md"
          cat > "$BODY" <<EOF
          ## Release v$VERSION

          This pull request was generated by the Release - Create Release PR workflow. Merging it starts protected publication.

          ## Finish this release

          1. Wait for **Build and test** to pass and review the generated file changes.
          2. Open the [draft GitHub release]($DRAFT_RELEASE_URL) and follow its editor guide. If the generated notes are already clear and accurate, no edits are needed.
          3. Merge normally. Merging confirms that the generated changes and draft release were reviewed.
          4. Approve the protected deployment when **Release - Publish Merged Release** pauses.

          ## Automated validation

          - Package version, generated distribution, non-browser tests, and package limits were validated by the preparation workflow.
          - The generated pull request runs the required full browser CI matrix. Refreshing an existing release explicitly reruns it.
          - The draft release is published only after this pull request is reviewed and merged.
          EOF
          if [[ -n "${HOTFIX_NUMBER:-}" ]]; then
            printf '\n## Latest-only hotfix\n\nApplies fix #%s to %s and publishes to latest. Beta development on main is unchanged. Merge into %s, not main.\n' \
              "$HOTFIX_NUMBER" "$NOTES_START_TAG" "$RELEASE_BASE" >> "$BODY"
          fi

          PR_URL="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // ""')"
          if [[ -n "$PR_URL" ]]; then
            gh pr edit "$PR_URL" --title "Release v$VERSION" --body-file "$BODY" --add-label release
            REFRESHED=true
          else
            PR_URL="$(gh pr create --base "$RELEASE_BASE" --head "$branch" --title "Release v$VERSION" --body-file "$BODY" --label release)"
            REFRESHED=false
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "refreshed=$REFRESHED" >> "$GITHUB_OUTPUT"
          echo "### Release pull request" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Run CI for the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "$branch"
