name: Automatic - PR Labels
run-name: PR ${{ github.event.pull_request.number }} - labels

on:
  pull_request_target:
    branches: [main, 'hotfix/v*']
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Label PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/pull-request.mjs