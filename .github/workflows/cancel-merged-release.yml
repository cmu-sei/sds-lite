name: Recovery - Cancel Unpublished Release
run-name: Cancel merged unpublished release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact merged but unpublished version, such as 1.2.0-beta.1
        required: true
        type: string
      confirmation:
        description: Retype the exact version to block publication and request a revert
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  stop:
    name: Stop release jobs before locked cancellation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      packages: read
    outputs:
      version: ${{ steps.cancel.outputs.version }}
    steps:
      - name: Require the default branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$SELECTED_BRANCH" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from $DEFAULT_BRANCH"
            exit 1
          fi

      - name: Check out the recovery controller
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js and registry authentication
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@cmu-sei'

      - name: Request cancellation and wait for finalization to stop
        id: cancel
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cancel-release.mjs request

  recover:
    name: Remove draft and open reviewed revert PR
    needs: stop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      issues: write
      packages: read
      pull-requests: write
      statuses: write
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and registry authentication
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@cmu-sei'

      - name: Verify unpublished state, block retries, and remove only the draft
        id: recovery
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/cancel-release.mjs cleanup

      - name: Create or reuse the revert pull request
        env:
          DEFAULT_BRANCH: ${{ steps.recovery.outputs.base-branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_COMMIT: ${{ steps.recovery.outputs.merge-commit }}
          RELEASE_PR_NUMBER: ${{ steps.recovery.outputs.pull-request }}
          REVERT_BRANCH: ${{ steps.recovery.outputs.revert-branch }}
          TAG: ${{ steps.recovery.outputs.tag }}
          RECOVERY_CONTROLLER: ${{ runner.temp }}/recovery-controller/cancel-release.mjs
        run: |
          mkdir -p "$(dirname "$RECOVERY_CONTROLLER")"
          cp scripts/cancel-release.mjs scripts/abandon-release.mjs scripts/release-version.mjs "$(dirname "$RECOVERY_CONTROLLER")"
          git fetch origin "$DEFAULT_BRANCH"
          git switch --detach "refs/remotes/origin/$DEFAULT_BRANCH"
          RECOVERY_PR="$(node "$RECOVERY_CONTROLLER" recovery-pr)"
          PR_URL="$(node -e 'console.log(JSON.parse(process.argv[1]).url)' "$RECOVERY_PR")"
          if [[ -n "$PR_URL" ]]; then
            PR_STATE="$(node -e 'console.log(JSON.parse(process.argv[1]).state)' "$RECOVERY_PR")"
            if [[ "$PR_STATE" == CLOSED ]]; then
              gh pr reopen "$PR_URL"
            fi
          else
            if ! git merge-base --is-ancestor "$MERGE_COMMIT" HEAD; then
              echo "::error::Release commit is not on the default branch. Publication remains blocked; recover manually"
              exit 1
            fi
            gh auth setup-git
            REMOTE_BRANCH="$(git ls-remote --heads origin "refs/heads/$REVERT_BRANCH")"
            if [[ -n "$REMOTE_BRANCH" ]]; then
              git fetch origin "refs/heads/$REVERT_BRANCH"
              git switch --create "$REVERT_BRANCH" FETCH_HEAD
            else
              git switch --create "$REVERT_BRANCH"
              node "$RECOVERY_CONTROLLER" revert
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "release: revert cancelled $TAG" -m "Reverts release commit: $MERGE_COMMIT"
            fi
            node "$RECOVERY_CONTROLLER" verify-revert
            if [[ -z "$REMOTE_BRANCH" ]]; then
              git push origin "HEAD:refs/heads/$REVERT_BRANCH"
            fi
            BODY="$RUNNER_TEMP/revert-release.md"
            printf '%s\n' \
              "## Cancel merged unpublished release $TAG" \
              "" \
              "Publication of release PR #$RELEASE_PR_NUMBER is permanently blocked by its recorded cancellation. Its draft GitHub release was removed after verifying that no tag or package version was published." \
              "" \
              "Review this revert, use Approve and run if GitHub requests workflow approval, and wait for Build and test before merging. It reverses only the release preparation commit; later work remains on the default branch. Do not rerun the old publication workflow. Prepare a newer base version after this PR merges." > "$BODY"
            PR_URL="$(gh pr create --base "$DEFAULT_BRANCH" --head "$REVERT_BRANCH" --title "Revert cancelled release $TAG" --body-file "$BODY" --label release)"
          fi
          {
            echo "### Cancelled unpublished $TAG"
            echo "- Publication is permanently blocked by the recorded cancellation of PR #$RELEASE_PR_NUMBER."
            echo "- Draft release removed; no published tag or package was deleted."
            if [[ "${PR_STATE:-}" == MERGED ]]; then
              echo "- Verified recovery PR is already merged: $PR_URL"
            else
              echo "- Review and merge the verified revert PR: $PR_URL"
            fi
            echo "- Use a newer base version for the next release."
          } >> "$GITHUB_STEP_SUMMARY"