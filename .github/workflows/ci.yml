name: Automatic - CI
run-name: "CI for ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

on:
  pull_request:
    branches: [main, 'hotfix/v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate build and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browser-image: ${{ steps.browser-image.outputs.browser-image }}

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Select the locked browser image
        id: browser-image
        run: node scripts/validate-release-pr.mjs browser-image

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and validate
        run: npm run test:validation

      - name: Verify the package contents
        run: npm run check:package

  browser:
    name: Browser (${{ matrix.project }})
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.validation.outputs.browser-image }}
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test browser
        env:
          HOME: /root
        run: npm run test:browser -- --project=${{ matrix.project }}

  required:
    name: Build and test
    if: always()
    needs: [validation, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require validation and browser tests
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [[ "$VALIDATION_RESULT" != success || "$BROWSER_RESULT" != success ]]; then
            echo "::error::Validation or browser tests failed"
            exit 1
          fi
