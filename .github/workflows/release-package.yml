name: Release - Publish Merged Release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      package-name: ${{ steps.release.outputs.package-name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out the merged release
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The merged release commit must be on main"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Reject a cancelled release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cancel-release.mjs assert-active

      - name: Validate release pull request
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node scripts/validate-release-pr.mjs

      - name: Validate release metadata
        id: release
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          if [[ "$VERSION" == *-beta.* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          RELEASE_TAG="v$VERSION" IS_PRERELEASE="$IS_PRERELEASE" node scripts/validate-release.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Preserve the committed distribution
        run: cp -R dist "$RUNNER_TEMP/committed-dist"

      - name: Build and validate
        run: npm run test:validation

      - name: Verify the committed distribution is current
        run: diff --recursive --brief "$RUNNER_TEMP/committed-dist" dist

      - name: Verify the package contents and size
        run: npm run check:package

      - name: Pack the tested package
        run: npm pack --ignore-scripts

      - name: Upload the release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifact
          path: cmu-sei-sds-lite-*.tgz
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Check out the released commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test browser
        run: npm run test:browser -- --project=${{ matrix.project }}

  publish:
    name: Publish release
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-publication-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    environment: ${{ needs.build.outputs.dist-tag == 'latest' && 'github-packages-production' || 'github-packages-beta' }}
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - name: Check out the released commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@cmu-sei"

      - name: Use the pinned npm version
        run: npm install --global npm@11.6.4

      - name: Reject a cancelled release after approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/cancel-release.mjs assert-active

      - name: Download the tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifact
          path: release-artifact

      - name: Locate the tested package
        id: artifact
        run: node scripts/release-artifact.mjs locate release-artifact

      - name: Inspect an existing GitHub release
        id: github-release
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          node scripts/cancel-release.mjs assert-active
          RELEASE_DATA="$(gh release view "$TAG" --json isDraft,isPrerelease)"
          IS_DRAFT="$(node -e 'console.log(JSON.parse(process.argv[1]).isDraft)' "$RELEASE_DATA")"
          ACTUAL_PRERELEASE="$(node -e 'console.log(JSON.parse(process.argv[1]).isPrerelease)' "$RELEASE_DATA")"
          EXPECTED_PRERELEASE=$([[ "$DIST_TAG" == beta ]] && echo true || echo false)
          if [[ "$ACTUAL_PRERELEASE" != "$EXPECTED_PRERELEASE" ]]; then
            echo "::error::$TAG has the wrong prerelease setting"
            exit 1
          fi
          if [[ "$IS_DRAFT" == false ]]; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [[ "$TAG_COMMIT" != "$EXPECTED_COMMIT" ]]; then
              echo "::error::$TAG points to $TAG_COMMIT instead of $EXPECTED_COMMIT"
              exit 1
            fi
          fi
          echo "draft=$IS_DRAFT" >> "$GITHUB_OUTPUT"

      - name: Verify package publication state
        id: registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
          RELEASE_IS_DRAFT: ${{ steps.github-release.outputs.draft }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set +e
          RESULT="$(npm view "$PACKAGE_NAME@$VERSION" dist.shasum --json 2>&1)"
          STATUS=$?
          set -e
          if [[ "$STATUS" -eq 0 ]]; then
            if [[ "$RELEASE_IS_DRAFT" == true ]]; then
              echo "::error::$PACKAGE_NAME@$VERSION already exists while its GitHub release is still a draft"
              exit 1
            fi
            REMOTE_SHASUM="$(node -e 'console.log(JSON.parse(process.argv[1]))' "$RESULT")"
            LOCAL_SHASUM="$(shasum "$TARBALL" | cut -d ' ' -f 1)"
            if [[ "$REMOTE_SHASUM" != "$LOCAL_SHASUM" ]]; then
              echo "::error::Published package checksum does not match the tested artifact"
              exit 1
            fi
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' <<< "$RESULT"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not verify whether $PACKAGE_NAME@$VERSION exists"
            printf '%s\n' "$RESULT"
            exit 1
          fi

      - name: Dry-run publication
        if: steps.registry.outputs.published == 'false'
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: node scripts/release-artifact.mjs publish "$TARBALL" "$DIST_TAG" --dry-run

      - name: Publish the reviewed GitHub release
        if: steps.github-release.outputs.draft == 'true'
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          node scripts/cancel-release.mjs assert-active
          RELEASE_DATA="$(gh release view "$TAG" --json isDraft,isPrerelease)"
          CURRENT_DRAFT="$(node -e 'console.log(JSON.parse(process.argv[1]).isDraft)' "$RELEASE_DATA")"
          CURRENT_PRERELEASE="$(node -e 'console.log(JSON.parse(process.argv[1]).isPrerelease)' "$RELEASE_DATA")"
          EXPECTED_PRERELEASE=$([[ "$DIST_TAG" == beta ]] && echo true || echo false)
          if [[ "$CURRENT_DRAFT" != true ]]; then
            echo "::error::$TAG was published outside this workflow"
            exit 1
          fi
          if [[ "$CURRENT_PRERELEASE" != "$EXPECTED_PRERELEASE" ]]; then
            echo "::error::$TAG prerelease setting changed before publication"
            exit 1
          fi
          gh release edit "$TAG" --target "$EXPECTED_COMMIT" --draft=false
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          if [[ "$TAG_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "::error::$TAG points to $TAG_COMMIT instead of $EXPECTED_COMMIT"
            exit 1
          fi

      - name: Publish to GitHub Packages
        if: steps.registry.outputs.published == 'false'
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          node scripts/cancel-release.mjs assert-active
          node scripts/release-artifact.mjs publish "$TARBALL" "$DIST_TAG"

      - name: Summarize publication
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PACKAGE_SLUG="${PACKAGE_NAME##*/}"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          PACKAGE_URL="https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/npm/package/$PACKAGE_SLUG"
          CDN_ROOT="https://cdn.jsdelivr.net/gh/$GITHUB_REPOSITORY@v$VERSION/dist"
          {
            echo "### Published v$VERSION"
            echo
            echo "- [GitHub release]($RELEASE_URL)"
            echo "- [GitHub Package]($PACKAGE_URL)"
            echo "- [CDN stylesheet]($CDN_ROOT/sds.css)"
            echo "- [CDN automatic setup]($CDN_ROOT/auto.js)"
            echo
            echo '```sh'
            echo "npm install $PACKAGE_NAME@$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the merged release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH"; then
            echo "Deleted $RELEASE_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not delete $RELEASE_BRANCH; delete it manually if it still exists"
          fi
